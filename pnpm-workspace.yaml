verifyDepsBeforeRun: error

packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  "@google/genai": true
  esbuild: true
  lefthook: true
  protobufjs: true

# Exact fresh pins that pnpm's release-age check would otherwise hold back.
# One entry per version; a bump replaces its entry rather than adding one.
minimumReleaseAgeExclude:
  - "tsrs@0.25.0-ts7.1.0-beta"
  - "@yielded/effect-tsrs@0.2.3"
  - "@yielded/effect-tsrs-linux-x64@0.2.3"
  - "@yielded/effect-tsrs-linux-arm64@0.2.3"
  - "@yielded/effect-tsrs-darwin-x64@0.2.3"
  - "@yielded/effect-tsrs-darwin-arm64@0.2.3"
  - "@yielded/effect-tsrs-win32-x64@0.2.3"
  # Effect 4 unblock: stable runtime and adapters replace removed unstable imports.
  - effect@4.1.4
  - "@foldkit/oxlint-plugin@0.15.4"
  - foldkit@0.170.0
  - "@foldkit/ui@0.170.0"
  - "@foldkit/devtools@0.170.0"
  - "@foldkit/vite-plugin@0.29.0"
  - "@foldkit/markdown@0.15.0"
  - "@effect/platform-browser@4.1.4"
  - "@effect/platform-node@4.1.4"
  - "@effect/platform-node-shared@4.1.4"
  - "@effect/vitest@4.1.4"
  - "@effect/tsgo-darwin-arm64@0.69.0"
  - "@effect/tsgo-darwin-x64@0.69.0"
  - "@effect/tsgo-linux-arm64@0.69.0"
  - "@effect/tsgo-linux-arm@0.69.0"
  - "@effect/tsgo-linux-x64@0.69.0"
  - "@effect/tsgo-win32-arm64@0.69.0"
  - "@effect/tsgo-win32-x64@0.69.0"
  - "@effect/tsgo@0.69.0"
  - "@tsrs/darwin-arm64@0.25.0-ts7.1.0-beta"
  - "@tsrs/darwin-x64@0.25.0-ts7.1.0-beta"
  - "@tsrs/linux-arm64-gnu@0.25.0-ts7.1.0-beta"
  - "@tsrs/linux-arm64-musl@0.25.0-ts7.1.0-beta"
  - "@tsrs/linux-x64-gnu@0.25.0-ts7.1.0-beta"
  - "@tsrs/linux-x64-musl@0.25.0-ts7.1.0-beta"
  - "@tsrs/win32-x64@0.25.0-ts7.1.0-beta"
